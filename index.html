<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מאגר השיעורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f8fd;--card:#ffffff;--text:#16293d;--muted:#56697d;--line:#d3e5f3;
  --accent:#1b6aa3;--on-accent:#ffffff;--accent-2:#4fa3dc;--accent-soft:#e1f0fb;--gold:#c99a2e;--gold-text:#806010;--gold-soft:#fbf3dc;
  --danger:#b3261e;--ok:#2e7d4f;--chip:#e8f2fa;--shadow:0 1px 3px rgba(22,60,100,.06),0 4px 14px rgba(22,60,100,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a25;--card:#162433;--text:#e6eff7;--muted:#97abbf;--line:#24384c;
    --accent:#5fb0e8;--on-accent:#0f1a25;--accent-2:#3a8cc6;--accent-soft:#1b3349;--gold:#e0b84f;--gold-text:#e0b84f;--gold-soft:#33291a;
    --chip:#1d2f42;--shadow:none;--title:#e6eff7;
  }
}
*{box-sizing:border-box}
body{overflow-x:clip;margin:0;background:var(--bg);color:var(--text);font-family:Heebo,Arial,sans-serif;font-size:16px;line-height:1.55}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:500;margin:12px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);min-height:40px;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--gold)}
.hwrap{max-width:1120px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--text)}
.logo span{color:var(--gold-text)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{padding:6px 10px;border-radius:8px;color:var(--text);font-weight:500}
nav a.on{background:var(--accent-soft);color:var(--accent)}
.userbox{font-size:14px;color:var(--muted)}
main{max-width:1120px;margin:auto;padding:18px 16px 170px}
h1{font-size:26px;margin:4px 0 12px}
h2{font-size:20px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--gold)}
h3{font-size:16px;margin:0 0 2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card-main{display:flex;gap:12px;color:var(--text)}
.card-main:hover{text-decoration:none}
.card-main:hover h3{color:var(--accent)}
.card img,.avatar{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--chip)}
.meta{font-size:13px;color:var(--muted)}
.card-foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.bar{flex:1;height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:3px 11px;font-size:14px;cursor:pointer}
.chip.sm{font-size:12px;padding:1px 8px;cursor:default}
.chip.on{background:var(--accent);color:var(--on-accent)}
.chip.sm{background:var(--gold-soft);color:var(--gold-text)}
.snip{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:6px 9px}
mark{background:#f3dc95;color:#1d2125;border-radius:3px}
.search{display:flex;flex-direction:column;gap:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero img{width:96px;height:96px;border-radius:18px;object-fit:cover}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.banner{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-bottom:3px solid var(--gold);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner .btn{background:var(--gold);color:#16293d;border-color:var(--gold);font-weight:700}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.hscroll .card{min-width:260px;max-width:280px}
.source{max-height:520px;overflow:auto;font-family:"Frank Ruhl Libre","David",serif;font-size:18px;line-height:1.8}
.source p{margin:0 0 10px}
.bm{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.bm:last-child{border:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line)}
.stars button{background:none;border:0;font-size:22px;cursor:pointer;color:var(--line);padding:0 1px}
.stars button.on{color:var(--gold)}
.notice{background:var(--gold-soft);color:var(--text);border:1px solid var(--gold);border-radius:10px;padding:9px 12px;font-size:14px}
.tagbox{position:relative}
.tagbox .tagwrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card)}
.tagbox .tagwrap input{border:0;flex:1;min-width:120px;padding:4px}
.tagbox .tagwrap input:focus{outline:none}
.tagbox .chip{cursor:default}
.tagbox .chip b{cursor:pointer;margin-inline-start:4px}
.sugg{position:absolute;inset-inline:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:4px;z-index:5;max-height:220px;overflow:auto;box-shadow:var(--shadow)}
.sugg div{padding:7px 12px;cursor:pointer}
.sugg div.hl,.sugg div:hover{background:var(--accent-soft)}
.sugg .new{color:var(--accent);font-weight:500}
/* dock player */
#dock{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:3px solid var(--gold);box-shadow:0 -4px 18px rgba(0,0,0,.08);display:none}
#dock.on{display:block}
#dockMedia{max-width:1120px;margin:auto}
#dockMedia .vid{position:relative;width:100%;max-width:520px;aspect-ratio:16/9;margin:8px auto 0;background:#000;border-radius:10px;overflow:hidden}
#dockMedia .vid video,#dockMedia .vid iframe,#dockMedia .vid #ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
#dock.minvid #dockMedia .vid{height:0;aspect-ratio:auto;margin:0}
.dock-row{max-width:1120px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 16px 0}
.dock-row img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.dinfo{flex:1;min-width:0}
.dinfo a{font-weight:700;color:var(--text);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dctl{display:flex;align-items:center;gap:6px}
.ib{background:var(--chip);border:0;border-radius:999px;height:44px;min-width:44px;color:var(--text);padding:0 10px;cursor:pointer;font-weight:700;font-size:14px}
.ib.play{background:var(--gold);color:#16293d;min-width:54px;height:54px;font-size:20px}
.dctl select{width:auto;padding:6px;border-radius:999px}
.dprog{max-width:1120px;margin:auto;display:flex;align-items:center;gap:10px;padding:4px 16px 10px;font-size:13px;color:var(--muted);direction:ltr}
.dprog input{flex:1;padding:0;border:0;accent-color:var(--accent)}
@media(max-width:600px){.dctl .hide-m{display:none}.dock-row img{display:none}}
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40}
#toast.on{opacity:1}


/* ===== עיצוב חדש: כרטיסי תמונה, עטיפות, שורות ===== */
.row-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 12px}
.row-h h2{margin:0}
.row-h .all{font-weight:700;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 4px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,188px);gap:18px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.shelf>*{scroll-snap-align:start}
.gridm{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:24px 18px}
.mcard{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.mcard h3{font-size:15.5px;line-height:1.35;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard h3 a{color:var(--text)}
.mcard .meta{font-size:13px;line-height:1.5}
.mcard .meta a{color:var(--muted)}
.cwrap{display:block;border-radius:14px}
.cover{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--cc,#1b6aa3);color:#fff;display:block;isolation:isolate;transition:transform .2s, box-shadow .2s}
.cwrap:hover .cover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,60,100,.18)}
.cover img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;z-index:-2}
.cover::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,color-mix(in srgb,var(--cc) 94%,#000) 0%,color-mix(in srgb,var(--cc) 60%,transparent) 42%,transparent 72%)}
.cover.noimg{background:radial-gradient(130% 100% at 90% 0%,color-mix(in srgb,var(--cc) 62%,#fff) 0%,var(--cc) 50%,color-mix(in srgb,var(--cc) 70%,#000) 100%)}
.cover.noimg::after{background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}
.cover .band{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px}
.cover .ct{position:absolute;inset-inline:12px;bottom:14px;font-weight:800;font-size:17px;line-height:1.22;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.cover .ct::before{content:"";display:block;width:28px;height:3px;background:var(--gold);border-radius:2px;margin-bottom:8px}
.cover .ct small{display:block;font-weight:500;font-size:12.5px;opacity:.92;margin-top:5px}
.cover.lg .ct{font-size:24px;inset-inline:18px;bottom:20px}
.cover .prog{position:absolute;bottom:0;inset-inline:0;height:5px;background:rgba(255,255,255,.3)}
.cover .prog i{display:block;height:100%;background:var(--gold)}
.cover .done{position:absolute;top:10px;inset-inline-end:10px;background:var(--gold);color:#16293d;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px}
.pbtn{position:absolute;top:calc(100% - 0px);width:46px;height:46px;border-radius:50%;background:var(--gold);color:#16293d;border:0;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;inset-inline-end:10px}
.mcard .pbtn{top:auto;bottom:auto}
.mcard .pslot{position:relative}
.mcard .pslot .pbtn{position:absolute;bottom:12px;inset-inline-end:12px}
.mcard:hover .pbtn,.mcard:focus-within .pbtn{opacity:1;transform:none}
@media (hover:none){.pbtn{opacity:1;transform:none}}
.mcard .pslot .cover .ct{inset-inline-end:66px}
.rabbi-c{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--text);min-width:0}
.rabbi-c:hover{text-decoration:none}
.rabbi-c img{width:132px;height:132px;border-radius:50%;object-fit:cover;background:var(--chip);transition:transform .2s}
.rabbi-c:hover img{transform:scale(1.04)}
.rabbi-c b{font-size:15px}
.shelf.rabbis{grid-auto-columns:minmax(140px,150px)}
.heroRec{--cc:#1b6aa3;display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--cc) 16%,var(--card)) 0%,var(--card) 70%);border-radius:22px;padding:22px;margin-top:6px}
@media(max-width:640px){.heroRec{grid-template-columns:1fr;padding:16px}.heroRec .cover{max-width:260px}}
.eyebrow{font-size:13px;font-weight:800;color:var(--gold-text);letter-spacing:.3px}
.heroRec h1{font-size:30px;line-height:1.2;margin:6px 0 8px}
.bigplay{font-size:18px;padding:12px 26px;border-radius:999px;background:var(--gold);border-color:var(--gold);color:#16293d;font-weight:800;min-height:52px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold-text);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
.streak svg{width:16px;height:16px}
.lhead{--cc:#1b6aa3;margin:-18px calc(50% - 50vw) 0;padding:30px max(16px,calc(50vw - 544px)) 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 30%,var(--bg)) 0%,var(--bg) 100%)}
.lhead .hero{align-items:flex-end;gap:24px}
.lhead .cover{width:210px;flex:none}
@media(max-width:600px){.lhead .cover{width:150px}}
.lhead h1{font-size:30px;line-height:1.2}
.sprog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.sprog .bar{max-width:220px}
.slist{display:flex;flex-direction:column}
.slist .it{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.slist .n{width:28px;text-align:center;font-weight:800;color:var(--muted)}
.slist .it.d .n{color:var(--gold-text)}
.slist .t{flex:1;min-width:0}
.slist .t a{color:var(--text);font-weight:700}
.siyum{position:fixed;inset:0;z-index:90;background:rgba(10,25,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.siyum .sbox{background:var(--card);border-radius:22px;padding:28px 26px;max-width:420px;width:100%;text-align:center;position:relative;border-top:6px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.siyum h2{justify-content:center;font-size:26px;margin:8px 0}
.siyum h2::before{display:none}
.cf{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media(max-width:600px){.hwrap{gap:6px 10px;padding:8px 12px}.logo{font-size:18px}nav a{padding:5px 8px;font-size:14.5px}.hwrap{flex-wrap:wrap}nav{order:5;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}nav:empty{display:none}nav a{white-space:nowrap}.userbox{margin-inline-start:auto;font-size:12px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userbox .btn{padding:4px 10px;min-height:34px}nav{min-width:0}.hbtns .btn.sm{padding:4px 9px;min-height:34px}.heroRec h1{font-size:24px}.lhead h1{font-size:24px}.lhead .cover.lg .ct{font-size:16px;inset-inline:12px;bottom:12px}.lhead .cover .band{font-size:10px}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.cover,.rabbi-c img,.pbtn{transition:none}}


/* ===== דף בית בסגנון מאגר: פס חיפוש, שורות, כרטיסי 16:9 ===== */
.kh-hero{margin:-18px calc(50% - 50vw) 0;padding:44px max(16px,calc(50vw - 544px)) 64px;text-align:center;color:#fff;position:relative;
  background:radial-gradient(90% 140% at 50% 0%,rgba(79,163,220,.35) 0%,transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px),linear-gradient(160deg,#0d2f4f 0%,#14507f 60%,#1b6aa3 100%)}
.kh-hero h1{font-size:46px;font-weight:800;margin:0;letter-spacing:.5px;line-height:1.1}
.kh-hero .tag{margin-top:10px;font-size:16px;opacity:.92;font-weight:500}
.kh-hero .goldline{width:64px;height:3px;background:var(--gold);border-radius:2px;margin:12px auto 0}
.kh-hero .streak{margin-top:14px}
.kh-search{position:relative;max-width:820px;margin:-34px auto 0;z-index:5}
.kh-search .box{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(13,47,79,.18);padding:6px 8px;border:1px solid var(--line)}
.kh-search input{border:0;background:transparent;font-size:18px;padding:12px 8px;flex:1;min-width:0}
.kh-search input:focus{outline:none}
.kh-search .box:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.kh-search .ico{background:none;border:0;width:44px;height:44px;border-radius:10px;cursor:pointer;color:var(--accent);display:grid;place-items:center}
.kh-search .ico:hover{background:var(--accent-soft)}
.kh-search .ico svg{width:22px;height:22px}
.kh-search .ico.rec{color:#c0392b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.kh-sugg{position:absolute;inset-inline:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(13,47,79,.15);overflow:hidden;text-align:start}
.kh-sugg a{display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--text)}
.kh-sugg a:hover,.kh-sugg a.hl{background:var(--accent-soft);text-decoration:none}
.kh-sugg img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.kh-sugg img.round{border-radius:50%}
.kh-sugg .k{font-size:12px;color:var(--muted);margin-inline-start:auto}
.kh-sugg .all{justify-content:center;font-weight:700;color:var(--accent);border-top:1px solid var(--line)}
.kh-quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.kh-quick button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px;color:var(--text)}
.kh-quick button:hover{border-color:var(--accent);color:var(--accent)}
.daily{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--gold-soft);border-inline-start:4px solid var(--gold);border-radius:12px;padding:10px 14px;margin-top:22px;flex-wrap:wrap}
/* כותרות שורה */
.row-h h2{position:relative;font-size:24px;font-weight:800;padding-top:8px}
.row-h h2::before{content:"";position:absolute;top:0;inset-inline-start:0;width:64px;height:3px;background:var(--gold);border-radius:2px}
.row-h .more{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:5px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.row-h .more:hover{background:var(--accent);color:var(--on-accent)}
/* שורות עם חצים */
.shelf-wrap{position:relative}
.shelf{grid-auto-columns:minmax(220px,236px)}
.shelf.rabbis{grid-auto-columns:minmax(140px,150px)}
.arrow{position:absolute;top:30%;z-index:3;width:42px;height:42px;border-radius:12px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(13,47,79,.12);display:none}
.arrow.prev{inset-inline-start:-14px}.arrow.next{inset-inline-end:-14px}
@media (hover:hover) and (min-width:700px){.shelf-wrap .arrow{display:block}}
.arrow[disabled]{opacity:0;pointer-events:none}
/* כרטיס 16:9 */
.mcard{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(13,47,79,.08);border-bottom:3px solid var(--accent);gap:0}
.mcard .cwrap{border-radius:0}
.mcard .cover{aspect-ratio:16/9;border-radius:0}
.cwrap:hover .cover{transform:none;box-shadow:none}
.mcard:hover{box-shadow:0 8px 22px rgba(13,47,79,.16)}
.mcard .cover .ct{font-size:15px;bottom:34px;inset-inline:12px}
.mcard .cover .ct::before{margin-bottom:6px;width:22px}
.mcard .cover .ct small{font-size:11.5px}
.mcard .cover .band{top:8px;inset-inline-start:8px}

<script>
/* =========================================================

const CONFIG = {

  // העלאה אוטומטית של קבצים למאגר GitHub (למנהל שהדביק מפתח גישה בדף הניהול)

  /* הדביקו כאן את ההגדרות מ-Firebase (Project settings → Your apps → Config).
     כל עוד apiKey ריק — האתר עובד במצב הדגמה, והנתונים נשמרים רק בדפדפן. */
  firebase: {

    storageBucket: 'tora-24762.firebasestorage.app',

/* ---------- נתוני יסוד ---------- */
const PARSHIOT=['בראשית','נח','לך לך','וירא','חיי שרה','תולדות','ויצא','וישלח','וישב','מקץ','ויגש','ויחי','שמות','וארא','בא','בשלח','יתרו','משפטים','תרומה','תצוה','כי תשא','ויקהל','פקודי','ויקרא','צו','שמיני','תזריע','מצורע','אחרי מות','קדושים','אמור','בהר','בחוקותי','במדבר','נשא','בהעלותך','שלח','קרח','חוקת','בלק','פנחס','מטות','מסעי','דברים','ואתחנן','עקב','ראה','שופטים','כי תצא','כי תבוא','נצבים','וילך','האזינו','וזאת הברכה'];
const CATS=[
  {id:'parasha',name:'פרשת שבוע',tags:PARSHIOT},
  {id:'halacha',name:'הלכה',tags:['שבת','בישול בשבת','כשרות','תפילה','ברכות','חושן משפט','טהרת המשפחה','אבלות','צדקה','בין אדם לחברו','מצוות התלויות בארץ']},
  {id:'gemara',name:'גמרא',tags:['ברכות','שבת','עירובין','פסחים','יומא','סוכה','ביצה','ראש השנה','תענית','מגילה','מועד קטן','חגיגה','יבמות','כתובות','נדרים','נזיר','סוטה','גיטין','קידושין','בבא קמא','בבא מציעא','בבא בתרא','סנהדרין','מכות','שבועות','עבודה זרה','זבחים','מנחות','חולין','בכורות','נדה']},
  {id:'emuna',name:'אמונה ומחשבה',tags:['גאולה','ארץ ישראל','תשובה','אורות','כוזרי','מהר"ל','נצח ישראל']},
  {id:'moadim',name:'מועדים',tags:['ראש השנה','יום כיפור','סוכות','חנוכה','פורים','פסח','שבועות','ספירת העומר','בין המצרים','יום העצמאות','יום ירושלים']},
  {id:'tanach',name:'תנ"ך',tags:['יהושע','שופטים','שמואל','מלכים','ישעיהו','ירמיהו','יחזקאל','תרי עשר','תהילים','משלי','איוב','חמש מגילות']},
  {id:'musar',name:'מוסר ומידות',tags:['מסילת ישרים','אורחות צדיקים','שמירת הלשון','ענווה','עבודת המידות']}
];
const STYLES=['עיוני','מוסרי','הלכה למעשה','חסידי','מחשבתי','קליל ונגיש','למתחילים'];
const SAMPLE='https://www.soundhelix.com/examples/mp3/SoundHelix-Song-';

function seed(){
  return {
    orgs:[
      {id:'y1',type:'yeshiva',name:'ישיבת דוגמה',parent:null,image:'',showOnLessons:false,donate:'',
       about:'דף דוגמה של ישיבה. כאן נציג הישיבה כותב על המוסד, דרך הלימוד והרבנים. אפשר לערוך את הטקסט, להעלות תמונה ולהוסיף קישור לתרומה.',
       styles:['עיוני'],defaults:{category:'',tags:[]}},
      {id:'r1',type:'rabbi',name:'הרב א׳ דוגמה',parent:'y1',image:'',showOnLessons:true,donate:'',about:'ראש הישיבה (דמות לדוגמה).',styles:['עיוני','מחשבתי'],defaults:{category:'',tags:[]}},
      {id:'r2',type:'rabbi',name:'הרב ב׳ דוגמה',parent:'y1',image:'',showOnLessons:true,donate:'',about:'ר״מ בישיבה (דמות לדוגמה).',styles:['הלכה למעשה','למתחילים'],defaults:{category:'halacha',tags:['שבת']}},
      {id:'r3',type:'rabbi',name:'הרב ג׳ דוגמה',parent:null,image:'',showOnLessons:true,donate:'',about:'מגיד שיעור עצמאי (דמות לדוגמה).',styles:['הלכה למעשה','מחשבתי'],defaults:{category:'',tags:[]}}
    ],
    lessons:[
      L('l1','פרשת וירא — סוד הכנסת האורחים','r1','y1','parasha',['וירא','חסד'],22,{type:'file',media:'audio',url:SAMPLE+'1.mp3'},true,
        'שיעור דוגמה על פרשת השבוע.','אברהם אבינו יושב בפתח האוהל בחום היום, ודווקא אז הוא מחפש אורחים. הכנסת אורחים גדולה מהקבלת פני השכינה.',''),
      L('l2','מהו בישול? כלי ראשון וכלי שני','r2','y1','halacha',['שבת','בישול בשבת'],35,{type:'file',media:'audio',url:SAMPLE+'2.mp3'},true,
        'פתיחה לסדרה על מלאכת בישול.','מלאכת מבשל היא אחת מל״ט מלאכות. נלמד מה נחשב בישול, כלי ראשון וכלי שני, ודין דבר שכבר התבשל.',''),
      L('l3','יש בישול אחר בישול','r2','y1','halacha',['שבת','בישול בשבת'],31,{type:'file',media:'audio',url:SAMPLE+'3.mp3'},true,
        'המשך הסדרה: יש בישול אחר בישול.','בשיעור הקודם ראינו את יסודות המלאכה. היום נעסוק ביש בישול אחר בישול בלח, ובדין חימום אוכל על הפלטה.',''),
      L('l4','חושן משפט סימן י״ג — בחירת דיינים בזבל״א','r3',null,'halacha',['חושן משפט','דיינים'],48,{type:'file',media:'audio',url:SAMPLE+'4.mp3'},false,
        'שיעור עם טקסט המקור לצידו. ההורדה חסומה בשיעור זה לפי בחירת המעלה.','כל אחד מבעלי הדין בורר לו דיין אחד, ושני הדיינים בוררים את השלישי. זה נקרא זה בורר לו אחד.','Shulchan Arukh, Choshen Mishpat 13'),
      L('l5','אמונה בדורנו — שיעור וידאו','r3',null,'emuna',['גאולה','ארץ ישראל'],15,{type:'file',media:'video',url:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4'},true,
        'דוגמה לשיעור וידאו בנגן העצמאי.','שיבת ציון בדורנו היא תהליך של גאולה שמתגלה קמעא קמעא.',''),
      L('l6','מסכת ברכות דף ב׳ — מאימתי קורין','r1','y1','gemara',['ברכות'],40,{type:'file',media:'audio',url:SAMPLE+'5.mp3'},true,
        'פתיחת המסכת.','מאימתי קורין את שמע בערבין, משעה שהכהנים נכנסים לאכול בתרומתן.','')
    ],
    permissions:[{email:'admin@demo.com',role:'admin',orgId:null},{email:'rep@demo.com',role:'rep',orgId:'y1'}],
    user:null,
    playlists:[{id:'pl1',name:'מסלול: הלכות שבת — מלאכת בישול',lessonIds:['l2','l3'],official:true,owner:null}],
    positions:{},bookmarks:{},ratings:{},history:[],daily:null,days:{},extraTags:{},dedications:{}
  };
}
function L(id,title,rabbiId,orgId,category,tags,mins,src,allowDownload,desc,transcript,sourceRef){
  const ser=id==='l2'||id==='l3'?{series:'הלכות שבת — מלאכת בישול',num:id==='l2'?1:2}:{};
  return {id,title,rabbiId,orgId,category,tags,duration:mins*60,src,allowDownload,desc,transcript,sourceRef,sourceText:'',date:'2026-10-01',demo:true,...ser};
}

/* ---------- אחסון וסנכרון ---------- */
const LS='torah_platform_v1';
const PRIV_KEYS=['positions','bookmarks','ratings','history','daily','days'];
const FB=(CONFIG.firebase&&CONFIG.firebase.apiKey&&window.firebase)?(()=>{
  try{const app=firebase.initializeApp(CONFIG.firebase);return {auth:firebase.auth(),db:firebase.firestore(),storage:firebase.storage?firebase.storage():null};}catch(e){console.error(e);return null;}
})():null;
let S=null;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(FB){
  /* במצב Firebase: התוכן הציבורי מגיע מהשרת, ורק הנתונים האישיים של אורח נשמרים בדפדפן */
  const priv={};PRIV_KEYS.forEach(k=>priv[k]=S&&S[k]!=null?S[k]:(k==='daily'?null:(k==='history'?[]:{})));
  S={orgs:[],lessons:[],permissions:[],playlists:[],extraTags:{},dedications:{},ytSources:[],user:null,...priv};
}else if(!S||!S.lessons) S=seed();
if(!S.days) S.days={};
if(!S.ytSources) S.ytSources=[];

/* מיפוי בין הנתונים בזיכרון לאוספים ב-Firestore */
const COLS={
  lessons:{get:()=>S.lessons,key:x=>x.id},
  orgs:{get:()=>S.orgs,key:x=>x.id},
  playlists:{get:()=>S.playlists,key:x=>x.id},
  permissions:{get:()=>S.permissions,key:x=>x.email},
  tags:{get:()=>Object.entries(S.extraTags).map(([cat,list])=>({cat,list})),key:x=>x.cat},
  dedications:{get:()=>Object.entries(S.dedications).map(([lessonId,items])=>({lessonId,items})),key:x=>x.lessonId},
  ytSources:{get:()=>S.ytSources||[],key:x=>x.id}
};
const SYNC={};Object.keys(COLS).forEach(c=>SYNC[c]={});
const clean=o=>JSON.parse(JSON.stringify(o));
let userWriteT=null,userLastJson='';

function save(){
  try{
    const local=FB?Object.fromEntries(PRIV_KEYS.map(k=>[k,S[k]])):S;
    localStorage.setItem(LS,JSON.stringify(local));
  }catch(e){}
  if(!FB) return;
  /* כתיבה לשרת רק של מה שהשתנה */
  const batch=FB.db.batch();let n=0;
  for(const [col,def] of Object.entries(COLS)){
    const cur={};def.get().forEach(x=>cur[def.key(x)]=x);
    for(const [id,x] of Object.entries(cur)){
      const j=JSON.stringify(x);
      if(SYNC[col][id]!==j){batch.set(FB.db.collection(col).doc(id),clean(x));SYNC[col][id]=j;n++;}
    }
    for(const id of Object.keys(SYNC[col])) if(!(id in cur)){batch.delete(FB.db.collection(col).doc(id));delete SYNC[col][id];n++;}
  }
  if(n) batch.commit().catch(e=>{console.error(e);toast(e.code==='permission-denied'?'אין לך הרשאה לפעולה הזו':'השמירה נכשלה, נסו שוב');});

  if(h==='github.com'){const m=x.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/(.+)$/);if(m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;}

}

const dayKey=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0');};
function isRestDay(d){
  if(d.getDay()===6) return true;
  try{const pr=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long'}).formatToParts(d);
    const day=+(pr.find(p=>p.type==='day')||{}).value,mon=(pr.find(p=>p.type==='month')||{}).value;
    return (mon==='תשרי'&&[1,2,10,15,22].includes(day))||(mon==='ניסן'&&[15,21].includes(day))||(mon==='סיון'&&day===6);
  }catch(e){return false;}
}
function streak(){
  const days=S.days||{};let n=0;const d=new Date();const grace=new Set();
  if(!days[dayKey(d)]) d.setDate(d.getDate()-1);
  for(let i=0;i<500;i++){
    if(days[dayKey(d)]) n++;
    else if(!isRestDay(d)){const w=new Date(d);w.setDate(w.getDate()-w.getDay());const wk=dayKey(w);if(grace.has(wk)||!n&&i>0)break;grace.add(wk);}
    d.setDate(d.getDate()-1);
  }
  return n;
}
function markDay(t){
  if(t<60) return;const k=dayKey(new Date());if(S.days[k]) return;
  S.days[k]=1;const s=streak();

}

const isPub=l=>!l.src||l.src.type!=='ytimport'||canUpload();
const pubLessons=()=>S.lessons.filter(isPub);
function filterLessons(f){
  f=f||F;const q=f.q.trim();
  return pubLessons().filter(l=>{
    if(f.cat&&l.category!==f.cat) return false;
    if(f.rabbi&&l.rabbiId!==f.rabbi) return false;
    if(f.org&&l.orgId!==f.org&&org(l.rabbiId)?.parent!==f.org) return false;
    if(f.tags.length&&!f.tags.every(t=>l.tags.includes(t))) return false;
    const m=l.duration/60;
    if(f.dur==='46'){if(m<=45) return false;} else if(f.dur&&m>+f.dur) return false;
    const media=l.src.type==='youtube'?'video':l.src.media;
    if(f.media&&media!==f.media) return false;
    if(q){
      const hay=[l.title,l.desc,l.transcript,org(l.rabbiId)?.name,org(l.orgId)?.name,catName(l.category),...l.tags].join(' ');
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
}
function countBy(list,keyFn){const m={};list.forEach(l=>[].concat(keyFn(l)).forEach(k=>{if(k)m[k]=(m[k]||0)+1;}));return m;}
function fillSelect(id,allLabel,items,cur){
  const el=$('#'+id);if(!el) return;
  el.innerHTML=`<option value="">${allLabel}</option>`+items.map(([v,n,c])=>`<option value="${esc(v)}" ${cur===v?'selected':''} ${!c&&cur!==v?'disabled':''}>${esc(n)} (${c||0})</option>`).join('');
}

  fillSelect('frabbi','כל הרבנים',S.orgs.filter(o=>o.type==='rabbi').map(o=>[o.id,o.name,cR[o.id]]).sort((a,b)=>(b[2]||0)-(a[2]||0)),F.rabbi);
  const cO=countBy(filterLessons({...F,org:''}),l=>[l.orgId,org(l.rabbiId)?.parent].filter((v,i,a)=>v&&a.indexOf(v)===i));
  fillSelect('forg','כל המוסדות',S.orgs.filter(o=>o.type!=='rabbi').map(o=>[o.id,o.name,cO[o.id]]),F.org);
  const cT=countBy(filterLessons({...F,tags:[]}),l=>l.tags);
  const tags=Object.keys(cT).sort((a,b)=>cT[b]-cT[a]);F.tags.forEach(t=>{if(!tags.includes(t))tags.unshift(t);});
  $('#ftags').innerHTML=tags.map(t=>`<button type="button" class="chip ${F.tags.includes(t)?'on':''}" data-act="ftag" data-t="${esc(t)}" aria-pressed="${F.tags.includes(t)}">${esc(t)} <span class="muted small">${cT[t]||0}</span></button>`).join('');
  const res=filterLessons();
  $('#rcount').textContent=`נמצאו ${res.length} שיעורים`;
  $('#results').innerHTML=res.length?res.map(l=>card(l,F.q)).join(''):(FB&&!loaded?'<div class="muted">טוען שיעורים…</div>':(S.lessons.length?'<div class="muted">לא נמצאו שיעורים. נסו לשנות את הסינון.</div>':'<div class="muted">עדיין אין שיעורים במאגר.'+(isAdmin()?' אפשר להתחיל ב<a href="#/upload">העלאת שיעור</a> או לייבא שיעורי דוגמה מ<a href="#/admin">דף הניהול</a>.':'')+'</div>'));
}
function snippet(text,q){
  if(!q||!text) return '';
  const w=q.trim().split(/\s+/)[0];const i=text.indexOf(w);if(i<0) return '';
  const s=Math.max(0,i-40),part=text.slice(s,i+w.length+60);
  return `<div class="snip">מתוך התמלול: …${esc(part).split(esc(w)).join('<mark>'+esc(w)+'</mark>')}…</div>`;
}
const CAT_COLORS={parasha:'#1b6aa3',halacha:'#2b6b5c',gemara:'#7a4a24',emuna:'#4f3f86',moadim:'#9c5d17',tanach:'#1f4e79',musar:'#8a3344'};
const catColor=id=>CAT_COLORS[id]||'#1b6aa3';
function coverData(l){const o=lessonImgOrg(l);const r=org(l.rabbiId)||org(l.orgId);
  return {img:realImg(o),color:catColor(l.category),band:catName(l.category),title:l.series||(r?r.name:catName(l.category)),sub:l.series&&r?r.name:''};}
function coverHTML(c,o){o=o||{};
  return `<div class="cover ${c.img?'':'noimg'} ${o.lg?'lg':''}" style="--cc:${c.color}">${c.img?`<img class="ph" src="${esc(c.img)}" alt="" loading="lazy">`:''}${c.band?`<span class="band">${esc(c.band)}</span>`:''}${o.done?'<span class="done">✓ הושלם</span>':''}<div class="ct">${esc(c.title)}${c.sub?`<small>${esc(c.sub)}</small>`:''}</div>${o.prog?`<div class="prog"><i style="width:${o.prog}%"></i></div>`:''}</div>`;}
function lessonPct(l){const p=S.positions[l.id];if(!p)return 0;if(p.done)return 100;return p.d?Math.min(100,p.t/p.d*100):0;}
function durTxt(sec){sec=Math.round(sec||0);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}
function card(l,q){

function allSeries(){
  const m={};pubLessons().forEach(l=>{if(!l.series)return;(m[l.series]=m[l.series]||[]).push(l);});
  return Object.entries(m).map(([name,ls])=>{ls.sort((a,b)=>(+a.num||0)-(+b.num||0));
    const done=ls.filter(l=>lessonPct(l)>=100).length;
    const rc={};ls.forEach(l=>{if(l.rabbiId)rc[l.rabbiId]=(rc[l.rabbiId]||0)+1;});
    const rid=Object.keys(rc).sort((a,b)=>rc[b]-rc[a])[0];
    return {name,ls,done,rabbi:org(rid),first:ls[0],last:ls.reduce((a,l)=>String(l.date)>String(a)?l.date:a,'')};
  }).sort((a,b)=>String(b.last).localeCompare(String(a.last)));

function loadSource(ref){

    el.innerHTML=paras.length?paras.map((p,i)=>`<p><b>${i+1}.</b> ${esc(p)}</p>`).join('')+`<div class="muted small">מקור: <a href="https://www.sefaria.org/${encodeURIComponent(ref)}" target="_blank" rel="noopener">ספריא</a></div>`:'<p class="muted">לא נמצא טקסט עבור ההפניה.</p>';
  }).catch(()=>{const el=$('#srcText');if(el)el.innerHTML='<p class="muted">לא ניתן לטעון את הטקסט כרגע.</p>';});
}

/* =========================================================
   רכיב תגיות עם השלמה אוטומטית ויצירת תגית חדשה
   ========================================================= */
function tagInput(host,getSugg,initial,onNew){
  let tags=[...(initial||[])],hl=0,items=[];
  host.innerHTML='<div class="tagbox"><div class="tagwrap"><span class="tg"></span><input placeholder="הקלידו תגית…"></div><div class="sugg" hidden></div></div>';
  const inp=host.querySelector('input'),box=host.querySelector('.sugg'),tg=host.querySelector('.tg');
  const draw=()=>{tg.innerHTML=tags.map((t,i)=>`<span class="chip">${esc(t)}<b data-i="${i}">×</b></span>`).join(' ');};
  const add=t=>{t=t.trim();if(!t||tags.includes(t))return;tags.push(t);if(!getSugg().includes(t)&&onNew)onNew(t);inp.value='';draw();list();};
  const list=()=>{
    const v=inp.value.trim();if(!v){box.hidden=true;return;}
    const all=getSugg().filter(t=>!tags.includes(t));
    const m=all.filter(t=>t.startsWith(v)).concat(all.filter(t=>!t.startsWith(v)&&t.includes(v))).slice(0,10);
    items=m.map(t=>({t,n:false}));if(!all.includes(v)&&!tags.includes(v))items.push({t:v,n:true});
    hl=0;box.innerHTML=items.map((x,i)=>`<div data-i="${i}" class="${x.n?'new':''} ${i===0?'hl':''}">${x.n?'+ יצירת תגית חדשה: ':''}${esc(x.t)}</div>`).join('');box.hidden=!items.length;
  };
  inp.addEventListener('input',list);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();if(items[hl])add(items[hl].t);else add(inp.value);}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hl=(hl+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;[...box.children].forEach((c,i)=>c.classList.toggle('hl',i===hl));}
    else if(e.key==='Backspace'&&!inp.value&&tags.length){tags.pop();draw();}
  });
  box.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();add(items[+d.dataset.i].t);}});
  tg.addEventListener('click',e=>{if(e.target.dataset.i!=null){tags.splice(+e.target.dataset.i,1);draw();}});
  inp.addEventListener('blur',()=>setTimeout(()=>box.hidden=true,150));
  draw();
  return {get:()=>tags,set:t=>{tags=[...t];draw();}};
}

/* ---------- כיווץ: כל קובץ אודיו/וידאו → MP3 מונו 48kbps ---------- */
const MP3_RATE=22050,MP3_KBPS=48;
const yieldUI=()=>new Promise(r=>setTimeout(r,0));
async function compressToMp3(file,onProgress){
  if(!window.lamejs) throw new Error('nolame');
  let buf=await file.arrayBuffer();
  const ctx=new OfflineAudioContext(1,1,MP3_RATE);
  const audio=await ctx.decodeAudioData(buf);buf=null;
  const n=audio.length,chs=audio.numberOfChannels;
  const data=[];for(let c=0;c<chs;c++)data.push(audio.getChannelData(c));
  const enc=new lamejs.Mp3Encoder(1,MP3_RATE,MP3_KBPS);
  const out=[],BLOCK=1152*64,pcm=new Int16Array(BLOCK);
  for(let i=0;i<n;i+=BLOCK){
    const len=Math.min(BLOCK,n-i);
    for(let j=0;j<len;j++){let v=0;for(let c=0;c<chs;c++)v+=data[c][i+j];v/=chs;v=v<-1?-1:v>1?1:v;pcm[j]=v<0?v*32768:v*32767;}
    const mp3=enc.encodeBuffer(len===BLOCK?pcm:pcm.subarray(0,len));if(mp3.length)out.push(new Uint8Array(mp3));
    if((i/BLOCK)%8===0){onProgress&&onProgress(i/n);await yieldUI();}
  }
  const end=enc.flush();if(end.length)out.push(new Uint8Array(end));
  onProgress&&onProgress(1);
  return {blob:new Blob(out,{type:'audio/mpeg'}),duration:audio.duration};
}
function urlDuration(u){
  return new Promise(res=>{const el=document.createElement('audio');let done=false;const fin=v=>{if(!done){done=true;el.removeAttribute('src');res(v);}};
    el.preload='metadata';el.onloadedmetadata=()=>fin(isFinite(el.duration)?el.duration:0);el.onerror=()=>fin(0);setTimeout(()=>fin(0),8000);el.src=u;});
}
function mediaDuration(file){
  return new Promise(res=>{const el=document.createElement(file.type.startsWith('video')?'video':'audio');const u=URL.createObjectURL(file);
    el.preload='metadata';el.onloadedmetadata=()=>{res(isFinite(el.duration)?el.duration:0);URL.revokeObjectURL(u);};el.onerror=()=>{res(0);URL.revokeObjectURL(u);};el.src=u;});
}
/* ---------- העלאה למאגר GitHub ---------- */
const GH_KEY='torah_gh_token';
const ghToken=()=>{try{return localStorage.getItem(GH_KEY)||''}catch(e){return ''}};
const ghActive=()=>isAdmin()&&!!ghToken();
const ghApi=path=>`https://api.github.com/repos/${CONFIG.github.owner}/${CONFIG.github.repo}/contents/${path}`;
const ghPagesUrl=path=>`https://${CONFIG.github.owner}.github.io/${CONFIG.github.repo}/${path}`;
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});}
async function ghUpload(blob,name,message,onProgress){
  if(blob.size>95*1048576) throw {code:'gh/too-big'};
  const path=`${CONFIG.github.folder}/${name}`;
  const body=JSON.stringify({message,content:await blobToB64(blob),branch:CONFIG.github.branch});
  await new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open('PUT',ghApi(path));
    x.setRequestHeader('Authorization','Bearer '+ghToken());x.setRequestHeader('Accept','application/vnd.github+json');
    x.upload.onprogress=e=>e.lengthComputable&&onProgress&&onProgress(e.loaded/e.total);
    x.onload=()=>x.status>=200&&x.status<300?res():rej({code:'gh/'+x.status});
    x.onerror=()=>rej({code:'gh/network'});x.send(body);
  });
  return {url:ghPagesUrl(path),ghPath:path};
}
async function ghDispatch(quiet){
  if(!ghToken()){if(!quiet)toast('כדי להפעיל מכאן צריך מפתח GitHub שמור (ראו למעלה)');return false;}
  try{const r=await fetch(`https://api.github.com/repos/${CONFIG.github.owner}/${CONFIG.github.repo}/actions/workflows/youtube-import.yml/dispatches`,
    {method:'POST',headers:{'Authorization':'Bearer '+ghToken(),'Accept':'application/vnd.github+json'},body:JSON.stringify({ref:CONFIG.github.branch})});
    if(r.status===204){if(!quiet)toast('הייבוא הופעל — יסתיים בעוד כמה דקות');return true;}
    if(!quiet)toast(r.status===404?'תהליך הייבוא עוד לא הותקן במאגר':r.status===403?'למפתח חסרה הרשאת Actions: Read and write':'ההפעלה נכשלה');
  }catch(e){if(!quiet)toast('ההפעלה נכשלה');}
  return false;
}
async function ghDelete(path){
  const h={'Authorization':'Bearer '+ghToken(),'Accept':'application/vnd.github+json'};
  const r=await fetch(ghApi(path)+'?ref='+CONFIG.github.branch,{headers:h});if(!r.ok)return;
  const {sha}=await r.json();
  await fetch(ghApi(path),{method:'DELETE',headers:h,body:JSON.stringify({message:'מחיקת שיעור',sha,branch:CONFIG.github.branch})});
}
function storeFile(blob,path,contentType,onProgress,meta){
  if(ghActive()) return ghUpload(blob,path.split('/').pop(),'העלאת שיעור: '+((meta&&meta.title)||''),onProgress);
  if(!FB) return Promise.resolve({url:URL.createObjectURL(blob),path:null,local:true});
  if(!FB.storage) return Promise.reject({code:'storage/unknown'});
  const ref=FB.storage.ref(path);
  return new Promise((res,rej)=>{
    const task=ref.put(blob,{contentType});
    task.on('state_changed',sn=>onProgress&&onProgress(sn.bytesTransferred/sn.totalBytes),rej,async()=>{try{res({url:await ref.getDownloadURL(),path});}catch(e){rej(e);}});
  });
}
const mb=x=>(x/1048576).toFixed(1)+'MB';

async function compressDl(){
  const files=[...($('#uFiles').files||[])];
  if(!files.length) return toast('בחרו קובץ אודיו או וידאו');
  const btns=[$('#uBtn'),$('#uDlBtn')],prog=$('#uProg');btns.forEach(b=>b.disabled=true);
  let done=0,lastDur=0;
  for(const [i,f] of files.entries()){
    const tag=files.length>1?`קובץ ${i+1}/${files.length}: `:'';
    try{
      const r=await compressToMp3(f,x=>prog.textContent=`${tag}מכווץ… ${Math.round(x*100)}%`);
      const name=f.name.replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]+/g,'_')+'.mp3';
      const u=URL.createObjectURL(r.blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),60000);
      prog.textContent=`${tag}הורד: ${name} — כווץ מ-${mb(f.size)} ל-${mb(r.blob.size)}`;
      lastDur=r.duration;done++;
      await new Promise(res=>setTimeout(res,400));
    }catch(e){console.error(e);toast(`לא הצלחנו לכווץ את "${f.name}"`);}
  }
  btns.forEach(b=>b.disabled=false);
  if(files.length===1&&lastDur) $('#uDur').value=Math.max(1,Math.round(lastDur/60));
  if(done) toast(done>1?`${done} קבצים כווצו והורדו`:'הקובץ כווץ והורד');
}
async function doUpload(){
  const links=$('#uLinks').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const files=[...($('#uFiles').files||[])];
  if(!links.length&&!files.length) return toast('בחרו קבצים או הדביקו קישור');
  const total=links.length+files.length;
  let title=$('#uTitle').value.trim();
  if(!title) title=(total===1&&files.length)?files[0].name.replace(/\.[^.]+$/,''):'שיעור';
  let orgId=$('#uOrg').value||null;let rabbiId=$('#uRabbi').value;
  if(!isAdmin()) orgId=perm().orgId;
  if(rabbiId==='__new'){const n=$('#uNewRabbi').value.trim();if(!n)return toast('הזינו שם לרב החדש');const im=getImg('uNewRabbiPick');if(!im)return toast('חובה להוסיף תמונה של הרב');rabbiId=uid('r');S.orgs.push({id:rabbiId,type:'rabbi',name:n,parent:orgId,image:im,showOnLessons:true,donate:'',about:'',styles:[],defaults:{category:'',tags:[]}});}
  if(rabbiId==='__org') rabbiId=null;
  const series=$('#uSeries').value.trim();let num=+$('#uNum').value||0;
  if(series&&!num) num=Math.max(0,...S.lessons.filter(l=>l.series===series).map(l=>+l.num||0))+1;
  const nextNum=()=>series?num++:0;
  const base={series,rabbiId,orgId,category:$('#uCat').value,tags:window._tagUi.get(),desc:$('#uDesc').value.trim(),transcript:$('#uTrans').value.trim(),
    sourceRef:$('#uRef').value.trim(),sourceText:$('#uSrcText').value.trim(),date:new Date().toISOString().slice(0,10),uploadedBy:S.user.email};
  const mkTitle=i=>total>1&&!series?`${title} — חלק ${i+1}`:title;
  const created=[];let idx=0;
  const btn=$('#uBtn'),prog=$('#uProg');btn.disabled=true;
  try{
    for(const f of files){
      const id=uid('l');const tag=total>1?`קובץ ${idx+1}/${files.length}: `:'';
      let blob=f,duration=0,media=f.type.startsWith('video')?'video':'audio',ext=(f.name.match(/\.([^.]+)$/)||[,'bin'])[1].toLowerCase(),ctype=f.type||'application/octet-stream';
      if($('#uCompress').checked){
        prog.textContent=tag+'מכווץ…';
        try{
          const r=await compressToMp3(f,x=>prog.textContent=`${tag}מכווץ… ${Math.round(x*100)}%`);
          blob=r.blob;duration=r.duration;media='audio';ext='mp3';ctype='audio/mpeg';
          prog.textContent=`${tag}כווץ מ-${mb(f.size)} ל-${mb(blob.size)}`;
        }catch(e){
          console.error(e);
          if(!confirm(`לא הצלחנו לכווץ את "${f.name}" (ייתכן שהקובץ גדול מדי לדפדפן או בפורמט לא נתמך). להעלות את הקובץ המקורי בלי כיווץ?`)) {idx++;continue;}
        }
      }
      if(!duration) duration=await mediaDuration(f);
      const st=await storeFile(blob,`lessons/${id}.${ext}`,ctype,x=>prog.textContent=`${tag}${ghActive()?'מעלה ל-GitHub':'מעלה'}… ${Math.round(x*100)}%`,{title:mkTitle(idx)});
      S.lessons.unshift({...base,num:nextNum(),id,title:mkTitle(idx),duration:Math.round(duration)||0,
        src:{type:'file',media,url:st.url,storagePath:st.path||'',ghPath:st.ghPath||''},allowDownload:$('#uDl').checked,size:blob.size});
      created.push(id);idx++;
      if(st.local) toast('מצב הדגמה: הקובץ נשמר זמנית בדפדפן בלבד');
      if(st.ghPath) window._ghJustUploaded=true;
    }
    for(const u of links){
      const y=ytId(u);let src;
      if(y) src=$('#uYtImp').checked?{type:'ytimport',ytId:y}:{type:'youtube',ytId:y};
      else{let m=$('#uMedia').value;if(m==='auto')m=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u)?'video':'audio';src={type:'file',media:m,url:u};}
      const id=uid('l');
      const dsec=src.type==='file'?Math.round(await urlDuration(u)):0;
      S.lessons.unshift({...base,num:nextNum(),id,title:mkTitle(idx),duration:dsec||(+$('#uDur').value||0)*60,src,allowDownload:$('#uDl').checked&&!y});
      created.push(id);idx++;
    }
  }catch(e){
    console.error(e);btn.disabled=false;
    const code=e&&e.code||'';
    prog.textContent='';
    toast(code==='gh/too-big'?'הקובץ גדול מ-95MB — סמנו כיווץ':code==='gh/401'?'מפתח GitHub לא תקף — עדכנו אותו בדף הניהול':code==='gh/403'||code==='gh/404'?'למפתח GitHub אין הרשאת כתיבה למאגר':/^gh\//.test(code)?'ההעלאה ל-GitHub נכשלה':code==='storage/unauthorized'?'אין הרשאה להעלות קבצים':(/storage\/(unknown|bucket-not-found|project-not-found)|retry-limit/.test(code)?'אחסון הקבצים עוד לא הופעל ב-Firebase. אפשר להשתמש ב"כווץ והורד"':'ההעלאה נכשלה'));
    if(!created.length) return;
  }
  btn.disabled=false;
  if(!created.length){prog.textContent='';return;}
  if(created.length>1&&confirm('ליצור מהשיעורים האלה סדרה (מסלול לימוד)?')) S.playlists.push({id:uid('pl'),name:title,lessonIds:created,official:true,owner:S.user.email});
  const anyImp=created.some(id=>{const x=lesson(id);return x&&x.src.type==='ytimport';});
  if(anyImp&&ghActive()) ghDispatch(true);
  save();toast(anyImp?'נקלט. השמע יורד מיוטיוב ויישמר אצלנו — השיעור יופיע לגולשים כשהייבוא יסתיים':window._ghJustUploaded?'נקלט. הקובץ יתנגן בעוד כדקה-שתיים, אחרי ש-GitHub יעדכן את האתר':`נקלטו ${created.length} שיעורים`);window._ghJustUploaded=false;location.hash='#/lesson/'+created[0];
}

      if($('#eOrg'))l.orgId=$('#eOrg').value||null;
      l.allowDownload=$('#eDl').checked;const dm=+$('#eDur').value;if(dm>=0)l.duration=Math.round(dm*60)||l.duration;
      const ns=$('#eSrc').value.trim();const cur=l.src.type==='youtube'||l.src.type==='ytimport'?'https://www.youtube.com/watch?v='+l.src.ytId:(l.src.url||'');
      if(ns&&ns!==cur){const y=ytId(ns);
        if(y)l.src={type:'ytimport',ytId:y};
        else if(/^https?:\/\//.test(ns))l.src={type:'file',media:/\.(mp4|webm|mov|m4v)(\?|$)/i.test(ns)?'video':'audio',url:ns};
        else return toast('הקישור לא תקין');
        if(l.src.type==='ytimport'&&ghActive())ghDispatch(true);}
      l.updated=new Date().toISOString();l.updatedBy=S.user.email;
      save();toast('השינויים נשמרו');location.hash='#/lesson/'+l.id;},
    ytAdd:()=>{const u=$('#ytUrl').value.trim();
      if(!/^https?:\/\/(www\.|m\.)?youtube\.com\/(@[^/?#]+|channel\/|c\/|user\/|playlist\?list=)/.test(u))return toast('קישור לא תקין — צריך קישור לערוץ (@...) או לפלייליסט');
      if(!$('#ytOk').checked)return toast('אפשר להוסיף רק מקור שיש עליו אישור מפורש מבעל התוכן');
      if(!$('#ytRabbi').value&&!$('#ytOrg').value)return toast('בחרו רב או מוסד');
      const m=u.match(/youtube\.com\/(@[^/?#]+)/);
      S.ytSources.push({id:uid('yt'),url:u,label:m?m[1]:(u.includes('list=')?'פלייליסט':u),rabbiId:$('#ytRabbi').value||null,orgId:$('#ytOrg').value||org($('#ytRabbi').value)?.parent||null,
        category:$('#ytCat').value,series:$('#ytSeries').value.trim(),importExisting:$('#ytExisting').checked,maxExisting:Math.min(200,+$('#ytMax').value||20),
        allowDownload:$('#ytDl').checked,enabled:true,initialized:false,seen:[],importedCount:0,addedBy:S.user.email,added:new Date().toISOString()});
      save();toast('המקור נוסף. הוא ייבדק בריצה הבאה');if(ghActive())ghDispatch(true);route(true);},
    toImport:()=>{const l=lesson(id);if(!l||l.src.type!=='youtube')return;l.src={type:'ytimport',ytId:l.src.ytId};if(P.l&&P.l.id===id){stopMedia();P.l=null;$('#dock').classList.remove('on');}save();if(ghActive())ghDispatch(true);toast('השיעור נכנס לתור הייבוא');route(true);},
    ytToggle:()=>{const x=S.ytSources.find(z=>z.id===id);if(x){x.enabled=!x.enabled;save();route(true);}},
    ytDel:()=>{if(!confirm('למחוק את המקור? שיעורים שכבר יובאו יישארו.'))return;S.ytSources=S.ytSources.filter(z=>z.id!==id);save();route(true);},
    ytRun:()=>{if(ghActive())ghDispatch(false);else window.open(`https://github.com/${CONFIG.github.owner}/${CONFIG.github.repo}/actions/workflows/youtube-import.yml`,'_blank');},
    seeAll:()=>{let f={};try{f=JSON.parse(b.dataset.f||'{}')}catch(e){}F={q:'',cat:'',tags:[],rabbi:'',org:'',dur:'',media:'',...f};if(location.hash==='#/search')vSearch();else location.hash='#/search';},
    hsAll:()=>{e.preventDefault();window._hsGo&&window._hsGo();},
    shelfScroll:()=>{const sh=b.parentElement.querySelector('.shelf');const d=+b.dataset.d;sh.scrollBy({left:-d*sh.clientWidth*0.85,behavior:'smooth'});},
    voice:()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();r.lang='he-IL';r.interimResults=false;b.classList.add('rec');
      r.onresult=ev=>{const t=ev.results[0][0].transcript;const i=$('#hsq');if(i){i.value=t;i.dispatchEvent(new Event('input'));i.focus();}};r.onend=()=>b.classList.remove('rec');r.onerror=()=>{b.classList.remove('rec');toast('לא הצלחנו לשמוע — נסו שוב');};r.start();},
    go:()=>{location.hash=b.dataset.h;},
    playSeries:()=>{const x=allSeries().find(z=>z.name===b.dataset.s);if(!x)return;const ids=x.ls.map(l=>l.id);const nx=x.ls.find(l=>lessonPct(l)<100)||x.ls[0];play(nx.id,null,ids);},
    siyumClose:()=>{const e=$('#siyum');if(e)e.remove();},
    siyumShare:()=>{window.open('https://wa.me/?text='+encodeURIComponent(`סיימתי את הסדרה "${b.dataset.s}" ב${CONFIG.siteName}! הדרן עלך.\n${baseUrl()}${seriesHref(b.dataset.s)}`),'_blank');},
    a11y:()=>{const pop=$('#a11yPop');pop.hidden=!pop.hidden;b.setAttribute('aria-expanded',String(!pop.hidden));},
    a11yZoom:()=>{const z=+b.dataset.z;A11Y.z=z===0?0:Math.max(-1,Math.min(3,A11Y.z+z));applyA11y();},
    waShare:()=>{const l=lesson(id);const r=org(l.rabbiId);const t=P.l&&P.l.id===id?Math.floor(P.time()):0;window.open('https://wa.me/?text='+encodeURIComponent(`${l.title}${r?' — '+r.name:''}\n${baseUrl()}#/lesson/${id}${t?'?t='+t:''}`),'_blank');},
    backupDl:()=>{const d={exported:new Date().toISOString(),site:CONFIG.siteName,lessons:S.lessons,orgs:S.orgs,playlists:S.playlists.filter(p=>p.official),permissions:S.permissions,extraTags:S.extraTags,dedications:S.dedications};
      const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=`backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);toast('קובץ הגיבוי הורד');},
    ghSave:async()=>{const t=$('#ghTok').value.trim();if(!t)return toast('הדביקו מפתח');
      try{const r=await fetch(`https://api.github.com/repos/${CONFIG.github.owner}/${CONFIG.github.repo}`,{headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}});
        if(r.status===401)return toast('המפתח לא תקף');if(!r.ok)return toast('למפתח אין גישה למאגר '+CONFIG.github.repo);
        const j=await r.json();if(j.permissions&&!j.permissions.push)return toast('למפתח אין הרשאת כתיבה (Contents: Read and write)');
        try{localStorage.setItem(GH_KEY,t)}catch(e){return toast('הדפדפן חוסם שמירה מקומית');}toast('המפתח נשמר ונבדק בהצלחה');route(true);
      }catch(e){toast('לא ניתן לבדוק את המפתח כרגע');}},
    ghRemove:()=>{try{localStorage.removeItem(GH_KEY)}catch(e){}toast('המפתח הוסר');route(true);},
    compressDl,
    addPerm:()=>{const em=$('#pEmail').value.trim().toLowerCase();if(!em.includes('@'))return toast('כתובת לא תקינה');S.permissions=S.permissions.filter(p=>p.email!==em);const r=$('#pRole').value;S.permissions.push({email:em,role:r,orgId:r==='rep'?$('#pOrg').value:null});save();route();},
    delPerm:()=>{S.permissions.splice(+b.dataset.i,1);save();route();},
    addOrg:()=>{const n=$('#nName').value.trim();if(!n)return toast('הזינו שם');const im=getImg('nImgPick');if(!im)return toast('חובה להוסיף תמונה של הרב או לוגו של המוסד');const oid=uid('o');S.orgs.push({id:oid,type:$('#nType').value,name:n,parent:$('#nParent').value||null,image:im,showOnLessons:true,donate:'',about:'',styles:[],defaults:{category:'',tags:[]}});save();location.hash='#/org/'+oid;},
    addOfficial:()=>{const n=$('#olName').value.trim();const ids=[...document.querySelectorAll('.olChk:checked')].map(c=>c.value);if(!n||!ids.length)return toast('בחרו שם ושיעורים');S.playlists.push({id:uid('pl'),name:n,lessonIds:ids,official:true,owner:S.user.email});save();toast('המסלול נוצר');route();},
    reset:()=>{if(confirm('לאפס את כל הנתונים?')){const u=S.user;S=seed();S.user=u;save();route();}},
    login:()=>{if(FB){FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{if(err.code!=='auth/popup-closed-by-user'&&err.code!=='auth/cancelled-popup-request')toast(err.code==='auth/unauthorized-domain'?'הדומיין לא מאושר ב-Firebase (ראו הדרכה)':'ההתחברות נכשלה');});return;}const em=$('#lEmail').value.trim().toLowerCase();if(!em.includes('@'))return toast('הזינו כתובת');S.user={email:em};save();route();},
    loginAs:()=>{S.user={email:b.dataset.e};save();route();},
    logout:()=>{if(FB){flushUser();FB.auth.signOut();location.hash='#/';return;}S.user=null;save();route();},
    importDemo:()=>{if(!confirm('לייבא שיעורי דוגמה? אפשר למחוק אותם אחר כך.'))return;const d=seed();d.orgs.forEach(o=>{if(!org(o.id))S.orgs.push(o);});d.lessons.forEach(l=>{if(!lesson(l.id))S.lessons.push(l);});d.playlists.forEach(p=>{if(!S.playlists.find(x=>x.id===p.id))S.playlists.push({...p,owner:S.user.email});});save();toast('שיעורי הדוגמה יובאו');},
    delLesson:()=>{if(!confirm('למחוק את השיעור לצמיתות?'))return;const dl=lesson(id);if(FB&&FB.storage&&dl&&dl.src&&dl.src.storagePath)FB.storage.ref(dl.src.storagePath).delete().catch(e=>console.error(e));if(dl&&dl.src&&dl.src.ghPath&&ghActive())ghDelete(dl.src.ghPath).catch(e=>console.error(e));S.lessons=S.lessons.filter(x=>x.id!==id);S.playlists.forEach(p=>{if(isAdmin()||p.owner===S.user.email)p.lessonIds=p.lessonIds.filter(x=>x!==id);});save();toast('השיעור נמחק');location.hash='#/';},
    newPl:()=>{const n=$('#newPl').value.trim();if(!n)return;S.playlists.push({id:uid('pl'),name:n,lessonIds:[],official:false,owner:S.user.email});save();route();},
    delPl:()=>{if(confirm('למחוק את הפלייליסט?')){S.playlists=S.playlists.filter(p=>p.id!==id);if(S.daily===id)S.daily=null;save();location.hash='#/me';}},
    rmFromPl:()=>{e.preventDefault();const p=S.playlists.find(x=>x.id===b.dataset.pl);p.lessonIds=p.lessonIds.filter(x=>x!==id);save();route();}
  };
  if(A[a]){if(b.tagName==='A'&&a!=='rmFromPl')e.preventDefault();A[a]();}
});

applyA11y();
if(FB) startSync();
route();
</script>
